<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Image Retouch Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Yuji+Syuku&family=Kiwi+Maru:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ui-bg: #1e1e1e;
            --accent: #007aff;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            background-color: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            overscroll-behavior: none;
        }

        .viewport {
            flex: 1;
            display: block; /* 中央寄せ干渉を防ぐためblockに変更 */
            position: relative;
            background: #111;
            overflow: hidden;
            max-height: calc(100dvh - 200px - var(--safe-bottom));
        }

        #canvas-container {
            position: absolute; /* ビューポートの左上(0,0)を完全基準にする */
            top: 0;
            left: 0;
            cursor: crosshair;
            transform-origin: top left; /* 指示通り左上原点を維持 */
            display: block;
            touch-action: none;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
        }
        #c-temp { pointer-events: none; }

        /* ペンサイズ変更時のポップアッププレビュー */
        #size-preview-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #444;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 1500;
            min-width: 100px;
            min-height: 100px;
        }
        #size-preview-circle {
            background: #fff;
            border-radius: 50%;
            margin-bottom: 8px;
        }
        #size-preview-text {
            font-size: 12px;
            font-weight: bold;
            color: #fff;
        }

        .ui-panel {
            background: var(--ui-bg);
            border-top: 1px solid #333;
            padding-bottom: calc(var(--safe-bottom) + 2px);
            z-index: 1000;
        }

        #adjust-panel {
            display: none;
            background: #2a2a2a;
            padding: 10px;
            border-top: 2px solid var(--accent);
        }

        .adj-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }

        .s-item {
            flex: 1; display: flex; align-items: center;
            gap: 5px; font-size: 11px; white-space: nowrap; min-width: 120px;
        }

        .s-item input[type="text"], .s-item select, .s-item input[type="range"] {
            flex: 1; background: #333; color: #fff;
            border: 1px solid #555; padding: 7px;
            border-radius: 4px; font-size: 14px; min-width: 0;
        }

        .btn-add-font {
            background: #555; color: white; border: none; border-radius: 4px;
            width: 30px; height: 33px; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .settings-bar {
            display: flex; padding: 8px 10px; gap: 10px;
            align-items: center; border-bottom: 1px solid #333; background: #111;
            flex-wrap: wrap;
        }

        .grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 5px; padding: 8px;
        }

        button {
            background: #333; color: white;
            border: 1px solid #444; padding: 11px 0;
            border-radius: 6px; font-size: 12px; font-weight: bold;
            cursor: pointer;
        }

        button:active { background: #555; }
        button.active { background: var(--accent); border-color: var(--accent); }
        .btn-apply { background: var(--accent); flex: 1; height: 42px; }
        .btn-cancel { background: #444; flex: 1; height: 42px; }
        .row-span { grid-column: span 2; }

        #color-preview {
            width: 24px; height: 24px; border-radius: 4px;
            border: 1px solid #fff; display: inline-block;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); display: flex;
            align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-box {
            background: #2a2a2a; border-radius: 12px; padding: 20px;
            width: 90%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #444;
        }
        .modal-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; text-align: center; }
        .modal-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .modal-btn {
            background: #444; color: white; border: none; padding: 12px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px;
        }
        .modal-btn.primary { background: var(--accent); }
        .modal-btn.success { background: #28a745; }
        .name-input-container { display: none; margin-top: 15px; border-top: 1px solid #444; padding-top: 15px; }
        .name-input-container input {
            width: 100%; background: #111; color: white; border: 1px solid #555;
            padding: 10px; border-radius: 6px; font-size: 14px;
        }
    </style>
</head>
<body>

<div class="viewport" id="main-viewport">
    <div id="canvas-container">
        <canvas id="c-main"></canvas>
        <canvas id="c-temp"></canvas>
    </div>
    
    <div id="size-preview-overlay">
        <div id="size-preview-circle"></div>
        <div id="size-preview-text">10 px</div>
    </div>
</div>

<div class="ui-panel">
    <div class="settings-bar">
        <div class="s-item">現在の色: <span id="color-preview" style="background-color: #ff0000;"></span></div>
        <div class="s-item">太さ:<input type="range" id="stroke-size" min="1" max="100" value="10"></div>
        <div class="s-item">タイプ:
            <select id="pen-type">
                <option value="normal">通常ペン</option>
                <option value="blur">なじませ（ぼかし）</option>
            </select>
        </div>
        <div class="s-item" id="zoom-controller">ズーム:<input type="range" id="view-zoom" min="0.1" max="8" step="0.05" value="1"></div>
    </div>

    <div id="adjust-panel">
        <div class="adj-row">
            <div class="s-item">内容:<input type="text" id="text-input" placeholder="テキストを入力..."></div>
            <div class="s-item">色:
                <select id="text-color-select">
                    <option value="#ffffff">白</option>
                    <option value="#000000">黒</option>
                    <option value="#ff0000" selected>赤</option>
                </select>
            </div>
            <div class="s-item">
                書体:<select id="font-family">
                    <option value="sans-serif">ゴシック</option>
                    <option value="serif">明朝体</option>
                    <option value="'Zen Kurenaido', cursive">手書き</option>
                    <option value="'Yuji Syuku', serif">毛筆風</option>
                    <option value="'Kiwi Maru', sans-serif">丸文字</option>
                </select>
                <button type="button" class="btn-add-font" onclick="document.getElementById('f-font').click()">＋</button>
            </div>
        </div>
        <div class="adj-row">
            <div class="s-item">大きさ:<input type="range" id="adjust-scale" min="0.5" max="10" step="0.1" value="2"></div>
            <div class="s-item">回転:<input type="range" id="adjust-rotation" min="0" max="360" step="1" value="0"></div>
        </div>
        <div style="display:flex; gap:10px;">
            <button type="button" onclick="cancelAdjust()" class="btn-cancel">中止</button>
            <button type="button" onclick="applyAdjust()" class="btn-apply">配置を確定</button>
        </div>
    </div>

    <div id="main-menu">
        <div class="grid">
            <button type="button" onclick="sm('line')" id="b-line" class="active">直線 (10度制限)</button>
            <button type="button" onclick="sm('text')" id="b-text">文字入れ</button>
            <button type="button" onclick="sm('picker')" id="b-picker">色習得 (スポイト)</button>
            <button type="button" onclick="sm('pan')" id="b-pan">移動 / ズーム</button>
            
            <button type="button" onclick="undo()" id="btn-undo">Undo</button>
            <button type="button" onclick="redo()" id="btn-redo">Redo</button>
            <button type="button" onclick="imp()" class="row-span" style="background:#444">画像読み込み</button>
            <button type="button" onclick="openSaveModal()" class="row-span" style="background:#28a745">画像を保存</button>
        </div>
    </div>
</div>

<div id="save-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div class="modal-title">画像の保存方法を選択</div>
        <div class="modal-buttons">
            <button type="button" class="modal-btn primary" onclick="handleOverwrite()">上書き保存 (同じファイル名)</button>
            <button type="button" class="modal-btn success" onclick="showFilenameInput()">別名で保存 (ファイル名指定)</button>
            
            <div id="filename-container" class="name-input-container">
                <p style="margin:0 0 8px 0; font-size:12px; color:#aaa;">新しいファイル名を入力してください:</p>
                <input type="text" id="new-filename" value="">
                <button type="button" class="modal-btn success" style="width:100%; margin-top:10px;" onclick="handleSaveAs()">この名前でダウンロード</button>
            </div>
            
            <button type="button" class="modal-btn" style="background:#555; margin-top:5px;" onclick="closeSaveModal()">キャンセル</button>
        </div>
    </div>
</div>

<input type="file" id="f-in" accept="image/*" style="display:none">
<input type="file" id="f-font" accept=".ttf,.otf,.woff,.woff2" style="display:none">

<script>
    let imgW = 720, imgH = 1612;
    let originalFileName = "retouched_image.jpg";
    const mc = document.getElementById('c-main'), tc = document.getElementById('c-temp');
    const mctx = mc.getContext('2d'), tctx = tc.getContext('2d');
    const container = document.getElementById('canvas-container');
    const vp = document.getElementById('main-viewport');
    
    let mode = 'line', isDrawing = false, x0, y0;
    let prevX = 0, prevY = 0;
    let history = [], redoStack = [];
    
    let scale = 1, panX = 0, panY = 0;
    let isPanning = false;

    // ポインタ追跡用マップ（マルチタッチ・ピンチ対応）
    let activePointers = new Map();
    let initialPinchDistance = 0;
    let initialPinchScale = 1;

    let adjX = 0, adjY = 0, adjScale = 2.0, adjRotation = 0;
    let currentColor = "#ff0000";
    let longPressTimer = null;
    let previewTimeout = null;

    function init() {
        resizeCanvas(imgW, imgH);
        mctx.filter = 'none';
        mctx.fillStyle = "#ffffff";
        mctx.fillRect(0, 0, imgW, imgH);
        
        // 初期の画面中央フィット配置（確実にレンダリング同期させて呼ぶ）
        requestAnimationFrame(() => {
            fitCanvasToViewport(imgW, imgH);
        });
        
        saveHistory();
        updateUI();
    }

    function resizeCanvas(w, h) {
        imgW = w; imgH = h;
        mc.width = w; mc.height = h;
        tc.width = w; tc.height = h;
        container.style.width = w + 'px';
        container.style.height = h + 'px';
        updateTransform();
    }

    // キャンバスを表示領域内に綺麗に収めて中央配置する関数（完全に修正）
    function fitCanvasToViewport(w, h) {
        const vpW = vp.clientWidth || window.innerWidth;
        const vpH = vp.clientHeight || (window.innerHeight - 250);
        
        // 縦横比を維持したまま、画面内に完全に収まる縮小率を算出（余白5pxを考慮）
        const scaleX = (vpW - 10) / w;
        const scaleY = (vpH - 10) / h;
        scale = Math.min(scaleX, scaleY);
        
        // 極端な値を防ぐセーフガード
        if (scale <= 0 || isNaN(scale)) scale = 1;
        if (scale > 1) scale = 1; // 元画像より大きくは広げない(100%上限)
        
        // transform-origin: top left; に基づいた絶対中央配置の計算式
        // ビューポートの中心位置から、縮小された画像自体の中心位置を差し引く
        panX = (vpW / 2) - ((w * scale) / 2);
        panY = (vpH / 2) - ((h * scale) / 2);
        
        const zoomSlider = document.getElementById('view-zoom');
        zoomSlider.min = Math.min(scale * 0.2, 0.05);
        zoomSlider.max = 8;
        zoomSlider.value = scale;
        
        updateTransform();
    }

    function updateTransform() {
        container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function updateUI() {
        document.getElementById('color-preview').style.backgroundColor = currentColor;
    }

    // ペンサイズ変更時に画面上にサイズインジケータをポップアップ表示する関数
    function showSizePreview(size) {
        const overlay = document.getElementById('size-preview-overlay');
        const circle = document.getElementById('size-preview-circle');
        const text = document.getElementById('size-preview-text');
        
        // 表示サイズを現在の画面のスケール感に合わせる
        const displaySize = size * scale;
        
        circle.style.width = displaySize + 'px';
        circle.style.height = displaySize + 'px';
        circle.style.backgroundColor = currentColor;
        text.textContent = size + " px";
        
        overlay.style.opacity = "1";
        
        clearTimeout(previewTimeout);
        previewTimeout = setTimeout(() => {
            overlay.style.opacity = "0";
        }, 1000); // 1秒間操作がなければ消す
    }

    // 太さスライダー変更時のイベント
    document.getElementById('stroke-size').oninput = (e) => {
        const size = parseInt(e.target.value);
        showSizePreview(size);
        if(mode === 'text-adjust') renderAdjust();
    };

    function saveHistory() {
        mctx.save();
        mctx.filter = 'none';
        history.push(mctx.getImageData(0, 0, imgW, imgH));
        mctx.restore();
        if(history.length > 21) history.shift();
        redoStack = [];
        updateButtons();
    }
    
    function undo() {
        if(history.length <= 1) return;
        redoStack.push(history.pop());
        mctx.save();
        mctx.filter = 'none';
        mctx.clearRect(0, 0, imgW, imgH); 
        mctx.putImageData(history[history.length - 1], 0, 0);
        mctx.restore();
        updateButtons();
    }
    
    function redo() {
        if(redoStack.length === 0) return;
        const d = redoStack.pop();
        history.push(d);
        mctx.save();
        mctx.filter = 'none';
        mctx.clearRect(0, 0, imgW, imgH); 
        mctx.putImageData(d, 0, 0);
        mctx.restore();
        updateButtons();
    }
    
    function updateButtons() {
        document.getElementById('btn-undo').disabled = history.length <= 1;
        document.getElementById('btn-redo').disabled = redoStack.length === 0;
    }

    function sm(m) {
        if (m === 'text') { startTextMode(); return; }
        mode = m;
        document.querySelectorAll('.grid button').forEach(b => b.classList.remove('active'));
        if(document.getElementById('b-'+m)) document.getElementById('b-'+m).classList.add('active');
        
        if (m === 'pan') { container.style.cursor = 'grab'; }
        else if (m === 'picker') { container.style.cursor = 'eyedropper'; }
        else { container.style.cursor = 'crosshair'; }
    }

    function getP(e) {
        const rect = container.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) * (imgW / rect.width),
            y: (e.clientY - rect.top) * (imgH / rect.height)
        };
    }

    document.getElementById('view-zoom').oninput = (e) => {
        const newScale = parseFloat(e.target.value);
        const vpW = vp.clientWidth;
        const vpH = vp.clientHeight;
        const centerX = vpW / 2;
        const centerY = vpH / 2;

        const worldX = (centerX - panX) / scale;
        const worldY = (centerY - panY) / scale;

        scale = newScale;
        panX = centerX - worldX * scale;
        panY = centerY - worldY * scale;

        updateTransform();
    };

    function imp() { document.getElementById('f-in').click(); }
    document.getElementById('f-in').onchange = (e) => {
        const f = e.target.files[0]; if(!f) return;
        originalFileName = f.name;
        const r = new FileReader();
        r.onload = (ev) => {
            const i = new Image();
            i.onload = () => {
                resizeCanvas(i.width, i.height);
                mctx.save();
                mctx.filter = 'none';
                mctx.clearRect(0, 0, imgW, imgH);
                mctx.drawImage(i, 0, 0);
                mctx.restore();
                
                // 次の描画フレームで新サイズを取得して完全に画面中央フィットさせる
                requestAnimationFrame(() => {
                    fitCanvasToViewport(i.width, i.height);
                });
                
                history = []; redoStack = [];
                saveHistory();
            };
            i.src = ev.target.result;
        };
        r.readAsDataURL(f);
    };

    document.getElementById('f-font').onchange = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const fontName = "CustomFont_" + Date.now();
        const reader = new FileReader();
        reader.onload = async (ev) => {
            try {
                const fontFace = new FontFace(fontName, ev.target.result);
                const loadedFace = await fontFace.load();
                document.fonts.add(loadedFace);
                const select = document.getElementById('font-family');
                const option = document.createElement('option');
                option.value = fontName;
                option.textContent = "追加: " + file.name.substring(0, 10);
                select.appendChild(option);
                select.value = fontName;
                if(mode === 'text-adjust') renderAdjust();
            } catch (err) { alert("フォントの読み込みに失敗しました"); }
        };
        reader.readAsArrayBuffer(file);
    };

    // Pointer Events制御群
    function handlePointerDown(e) {
        e.preventDefault();
        activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });
        
        if (activePointers.size >= 2) {
            clearTimeout(longPressTimer);
            const pts = Array.from(activePointers.values());
            const dx = pts[1].clientX - pts[0].clientX;
            const dy = pts[1].clientY - pts[0].clientY;
            initialPinchDistance = Math.hypot(dx, dy);
            initialPinchScale = scale;
            return;
        }

        const p = getP(e);
        x0 = p.x; y0 = p.y;
        prevX = p.x; prevY = p.y;
        
        if (mode !== 'pan' && mode !== 'text-adjust' && mode !== 'line') {
            longPressTimer = setTimeout(() => {
                pickColor(p.x, p.y);
            }, 500);
        }

        if (mode === 'pan') {
            isPanning = true;
            container.style.cursor = 'grabbing';
            return;
        }
        if (mode === 'picker') {
            pickColor(p.x, p.y);
            return;
        }
        if (mode === 'text-adjust') {
            isDrawing = true;
            return;
        }
        if (mode === 'line') {
            isDrawing = true;
            tctx.filter = 'none';
            tctx.clearRect(0, 0, imgW, imgH);
        }
    }

    function handlePointerMove(e) {
        e.preventDefault();
        if (!activePointers.has(e.pointerId)) return;
        
        const lastPos = activePointers.get(e.pointerId);
        const movementX = e.clientX - lastPos.clientX;
        const movementY = e.clientY - lastPos.clientY;
        activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });

        if (activePointers.size >= 2) {
            const pts = Array.from(activePointers.values());
            const dx = pts[1].clientX - pts[0].clientX;
            const dy = pts[1].clientY - pts[0].clientY;
            const currentDistance = Math.hypot(dx, dy);
            if (initialPinchDistance > 0 && currentDistance > 0) {
                const factor = currentDistance / initialPinchDistance;
                let newScale = initialPinchScale * factor;
                newScale = Math.max(0.1, Math.min(newScale, 8));

                const currentCenterX = (pts[0].clientX + pts[1].clientX) / 2;
                const currentCenterY = (pts[0].clientY + pts[1].clientY) / 2;

                const rect = vp.getBoundingClientRect();
                const centerX = currentCenterX - rect.left;
                const centerY = currentCenterY - rect.top;

                const worldX = (centerX - panX) / scale;
                const worldY = (centerY - panY) / scale;

                scale = newScale;
                panX = centerX - worldX * scale;
                panY = centerY - worldY * scale;

                updateTransform();
                document.getElementById('view-zoom').value = scale;
            }
            return;
        }

        if (Math.hypot(movementX, movementY) > 3) {
            clearTimeout(longPressTimer);
        }

        if (!isDrawing && !isPanning) return;

        if (isPanning) {
            panX += movementX;
            panY += movementY;
            updateTransform();
            return;
        }

        const p = getP(e);

        if (mode === 'text-adjust' && isDrawing) {
            adjX += (p.x - x0); adjY += (p.y - y0);
            x0 = p.x; y0 = p.y; renderAdjust();
            return;
        }

        if (mode === 'line' && isDrawing) {
            const penType = document.getElementById('pen-type').value;
            
            if (penType === 'blur') {
                const size = parseFloat(document.getElementById('stroke-size').value);
                const dx = p.x - prevX;
                const dy = p.y - prevY;
                
                mctx.save();
                mctx.globalAlpha = 0.12;
                mctx.filter = 'none';
                
                mctx.drawImage(
                    mc,
                    p.x - dx * 4 - size / 2,
                    p.y - dy * 4 - size / 2,
                    size,
                    size,
                    p.x - size / 2,
                    p.y - size / 2,
                    size,
                    size
                );
                mctx.restore();
            } else {
                tctx.save();
                tctx.filter = 'none';
                tctx.clearRect(0, 0, imgW, imgH);
                setupContext(tctx);
                
                let dx = p.x - x0; let dy = p.y - y0;
                let angle = Math.atan2(dy, dx);
                let distance = Math.hypot(dx, dy);
                const step = 10 * Math.PI / 180;
                angle = Math.round(angle / step) * step;
                let targetX = x0 + distance * Math.cos(angle);
                let targetY = y0 + distance * Math.sin(angle);
                
                tctx.beginPath(); tctx.moveTo(x0, y0); tctx.lineTo(targetX, targetY); tctx.stroke();
                tctx.restore();
            }
            prevX = p.x; prevY = p.y;
        }
    }

    function handlePointerUp(e) {
        e.preventDefault();
        clearTimeout(longPressTimer);
        activePointers.delete(e.pointerId);
        
        if (activePointers.size < 2) initialPinchDistance = 0;

        if (isPanning) { 
            isPanning = false; 
            container.style.cursor = 'grab'; 
            return; 
        }
        if (!isDrawing) return;
        isDrawing = false;
        
        if (mode === 'line') {
            const penType = document.getElementById('pen-type').value;
            if (penType === 'blur') {
                tctx.clearRect(0, 0, imgW, imgH);
                saveHistory();
            } else {
                let p = getP(e);
                if (isNaN(p.x) || isNaN(p.y)) p = { x: prevX, y: prevY };
                
                mctx.save();
                setupContext(mctx);
                
                let dx = p.x - x0; let dy = p.y - y0;
                let angle = Math.atan2(dy, dx);
                let distance = Math.hypot(dx, dy);
                const step = 10 * Math.PI / 180;
                angle = Math.round(angle / step) * step;
                let targetX = x0 + distance * Math.cos(angle);
                let targetY = y0 + distance * Math.sin(angle);
                
                mctx.beginPath(); mctx.moveTo(x0, y0); mctx.lineTo(targetX, targetY); mctx.stroke();
                mctx.restore();
                
                tctx.clearRect(0, 0, imgW, imgH);
                saveHistory();
            }
        }
    }

    function handlePointerCancel(e) {
        clearTimeout(longPressTimer);
        activePointers.delete(e.pointerId);
        if (isDrawing || isPanning) {
            isDrawing = false;
            isPanning = false;
            tctx.clearRect(0, 0, imgW, imgH);
        }
    }

    function setupContext(ctx) {
        ctx.lineWidth = document.getElementById('stroke-size').value;
        ctx.strokeStyle = currentColor;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.filter = 'none'; 
    }

    function pickColor(x, y) {
        if (x < 0 || x >= imgW || y < 0 || y >= imgH) return;
        mctx.save();
        mctx.filter = 'none';
        const imgData = mctx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
        mctx.restore();
        currentColor = `#${imgData[0].toString(16).padStart(2,'0')}${imgData[1].toString(16).padStart(2,'0')}${imgData[2].toString(16).padStart(2,'0')}`;
        updateUI(); sm('line');
    }

    function startTextMode() {
        mode = 'text-adjust';
        adjX = imgW / 2; adjY = imgH / 2; adjScale = 2.0; adjRotation = 0;
        document.getElementById('text-input').value = "テキスト";
        document.getElementById('adjust-scale').value = 2.0;
        document.getElementById('adjust-rotation').value = 0;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('adjust-panel').style.display = 'block';
        renderAdjust();
        setTimeout(() => document.getElementById('text-input').focus(), 150);
    }

    function renderAdjust() {
        tctx.save(); 
        tctx.filter = 'none';
        tctx.clearRect(0, 0, imgW, imgH); 
        tctx.globalAlpha = 0.8;
        setupContext(tctx);
        tctx.translate(adjX, adjY); tctx.rotate(adjRotation * Math.PI / 180);
        const txt = document.getElementById('text-input').value;
        const font = document.getElementById('font-family').value;
        const tColor = document.getElementById('text-color-select').value;
        tctx.font = `bold ${20 * adjScale}px ${font}`; tctx.fillStyle = tColor;
        tctx.textAlign = "center"; tctx.textBaseline = "middle";
        tctx.fillText(txt, 0, 0); tctx.restore();
    }

    document.getElementById('adjust-scale').oninput = (e) => { adjScale = parseFloat(e.target.value); renderAdjust(); };
    document.getElementById('adjust-rotation').oninput = (e) => { adjRotation = parseFloat(e.target.value); renderAdjust(); };
    document.getElementById('text-input').oninput = renderAdjust;
    document.getElementById('font-family').onchange = renderAdjust;
    document.getElementById('text-color-select').onchange = renderAdjust;

    function applyAdjust() {
        mctx.save(); 
        mctx.filter = 'none';
        setupContext(mctx);
        mctx.translate(adjX, adjY); mctx.rotate(adjRotation * Math.PI / 180);
        const txt = document.getElementById('text-input').value;
        const font = document.getElementById('font-family').value;
        const tColor = document.getElementById('text-color-select').value;
        if(txt) {
            mctx.font = `bold ${20 * adjScale}px ${font}`; mctx.fillStyle = tColor;
            mctx.textAlign = "center"; mctx.textBaseline = "middle"; mctx.fillText(txt, 0, 0);
        }
        mctx.restore(); finishAdjust();
    }
    
    function cancelAdjust() { finishAdjust(); }
    
    function finishAdjust() {
        tctx.save();
        tctx.clearRect(0, 0, imgW, imgH);
        tctx.restore();
        mctx.filter = 'none';
        tctx.filter = 'none';
        document.getElementById('main-menu').style.display = 'block';
        document.getElementById('adjust-panel').style.display = 'none';
        saveHistory(); sm('line');
    }

    function openSaveModal() {
        document.getElementById('save-modal').style.display = 'flex';
        document.getElementById('filename-container').style.display = 'none';
        let baseName = originalFileName.substring(0, originalFileName.lastIndexOf('.')) || originalFileName;
        document.getElementById('new-filename').value = baseName + "_fixed.jpg";
    }

    function closeSaveModal() { document.getElementById('save-modal').style.display = 'none'; }
    function showFilenameInput() { document.getElementById('filename-container').style.display = 'block'; }
    function handleOverwrite() { closeSaveModal(); executeDownload(originalFileName); }

    function handleSaveAs() {
        let filename = document.getElementById('new-filename').value.trim();
        if(!filename) { alert("ファイル名を入力してください。"); return; }
        if(!filename.toLowerCase().endsWith('.jpg') && !filename.toLowerCase().endsWith('.jpeg')) { filename += ".jpg"; }
        closeSaveModal();
        executeDownload(filename);
    }

    function executeDownload(targetName) {
        mctx.save();
        mctx.filter = 'none';
        
        mc.toBlob((blob) => {
            mctx.restore();
            if (!blob) {
                alert("画像の生成に失敗しました");
                return;
            }
            try {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = targetName; link.href = url; link.style.display = 'none';
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                setTimeout(() => { 
                    URL.revokeObjectURL(url);
                    alert(`画像を「${targetName}」として保存しました！`); 
                }, 100);
            } catch (e) {
                const reader = new FileReader();
                reader.onloadend = function() {
                    showImageModal(reader.result, targetName);
                }
                reader.readAsDataURL(blob);
            }
        }, 'image/jpeg', 0.95);
    }

    function showImageModal(dataUrl, targetName) {
        const modal = document.createElement('div');
        modal.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:10000; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;';
        modal.innerHTML = `
            <p style="color:white; margin-bottom:10px; text-align:center; font-size:14px;">お使いの環境では直接保存が制限されています。<br>画像を長押しまたは右クリックして「画像を保存」を選び、名前を「${targetName}」に変更して保存してください。</p>
            <img src="${dataUrl}" style="max-width:90%; max-height:70%; border:2px solid #555;">
            <button onclick="this.parentElement.remove()" style="margin-top:20px; padding:12px 24px; background:#007aff; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer;">閉じる</button>
        `;
        document.body.appendChild(modal);
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker registered', reg))
                .catch(err => console.error('Service Worker registration failed', err));
        });
    }

    container.addEventListener('pointerdown', handlePointerDown);
    container.addEventListener('pointermove', handlePointerMove);
    container.addEventListener('pointerup', handlePointerUp);
    container.addEventListener('pointercancel', handlePointerCancel);

    init();
</script>
</body>
</html>
