<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MangaRetouch">
<link rel="manifest" href="manifest.json">

<title>Manga Retouch Mobile</title>

<style>
:root{
    --panel:#1d1d1d;
    --accent:#007aff;
    --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    touch-action:none;
}

body{
    display:flex;
    flex-direction:column;
}

#viewport{
    flex:1;
    position:relative;
    overflow:hidden;
    background:#111;
}

#canvas-wrap{
    position:absolute;
    top:0;
    left:0;
    transform-origin:top left;
    touch-action:none;
}

canvas{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
}

#temp{
    pointer-events:none;
}

.bottom-bar{
    height:74px;
    background:var(--panel);
    border-top:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding-bottom:var(--safe-bottom);
    z-index:1000;
}

.tool-btn{
    width:54px;
    height:54px;
    border:none;
    background:none;
    color:#aaa;
    border-radius:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:24px;
    gap:3px;
}

.tool-btn.active{
    background:#333;
    color:#fff;
}

.tool-label{
    font-size:10px;
}

.panel{
    position:absolute;
    left:0;
    bottom: calc(5px + var(--safe-bottom));
    width:100%;
    background:rgba(25,25,25,.96);
    backdrop-filter:blur(10px);
    border-top:1px solid #333;
    padding:8px 10px; /* 統一 */
    z-index:2000;
    display:none;
}

.panel.show{
    display:block;
}

.memo-panel-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 400px;
    background: rgba(30,30,30,.98);
    backdrop-filter: blur(20px);
    border: 1px solid #444;
    border-radius: 16px;
    padding: 16px;
    z-index: 4000;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    display: none;
}

.memo-panel-overlay.show {
    display: block;
}

.row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

.group{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:6px;
}

label{
    font-size:12px;
    color:#aaa;
}

textarea,
select{
    width:100%;
    background:#333;
    color:#fff;
    border:1px solid #555;
    border-radius:10px;
    padding:10px;
    font-size:16px;
}

textarea{
    resize:none;
    min-height:120px;
}

.memo-textarea {
    min-height: 200px;
    font-family: inherit;
    line-height: 1.4;
}

input[type="range"]{
    width:100%;
}

.action-btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:11px;
    color:#fff;
    font-size:14px;
    font-weight:bold;
}

.primary{
    background:var(--accent);
}

.secondary{
    background:#444;
}

.top-ui{
    position:absolute;
    top:10px;
    right:10px;
    display:flex;
    gap:8px;
    z-index:3000;
}

.top-btn{
    border:none;
    border-radius:10px;
    background:rgba(0,0,0,.6);
    color:#fff;
    padding:10px 14px;
    font-size:13px;
}

.memo-btn {
    background: rgba(0, 122, 255, 0.6);
    border: 1px solid rgba(0, 122, 255, 0.4);
}

#size-preview{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    opacity:0;
    transition:.2s;
    z-index:5000;
}

#size-circle{
    border-radius:50%;
    background:#fff;
}

.hidden{
    display:none;
}

.row-disabled {
    opacity: 0.38;
    pointer-events: none;
}

.row-disabled label,
.row-disabled input,
.row-disabled select {
    cursor: not-allowed;
}

.text-compact-input {
    width: 100%;
    background: #333;
    color: #fff;
    border: 1px solid #555;
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 14px;
    resize: none;
    min-height: 52px;
    max-height: 80px;
    margin-bottom: 7px;
    display: block;
    box-sizing: border-box;
}

.ctrl-grid3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    margin-bottom: 7px;
}

.cg {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.cg label {
    font-size: 10px;
    color: #aaa;
}

.cg select {
    width: 100%;
    background: #333;
    color: #fff;
    border: 1px solid #555;
    border-radius: 8px;
    padding: 5px 4px;
    font-size: 12px;
}

.slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
}

.slider-label {
    font-size: 11px;
    color: #aaa;
    white-space: nowrap;
    min-width: 58px;
}
</style>
</head>
<body>

<div id="viewport">

    <div class="top-ui">
        <button class="top-btn memo-btn" onclick="toggleMemoPanel()">原案メモ</button>
        <button class="top-btn" onclick="fitCanvas()">Fit</button>
        <button class="top-btn" onclick="openImage()">読込</button>
        <button class="top-btn" onclick="saveImage()">保存</button>
    </div>

    <div id="canvas-wrap">
        <canvas id="main"></canvas>
        <canvas id="temp"></canvas>
    </div>

    <div id="size-preview">
        <div id="size-circle"></div>
    </div>

    <div class="memo-panel-overlay" id="memo-panel">
        <div class="row">
            <div class="group">
                <label>原案テキスト（ここに貼り付けて確認できます）</label>
                <textarea id="memo-input" class="memo-textarea" placeholder="ここにテキストを貼り付けておくと、別アプリに切り替えずに文字入れ作業が行えます。自動で保存されます。"></textarea>
            </div>
        </div>
        <div class="row">
            <button class="action-btn secondary" onclick="toggleMemoPanel()">閉じる</button>
        </div>
    </div>

    <div class="panel show" id="pen-panel">
        <div class="row">
            <div class="group">
                <label>太さ</label>
                <input type="range" id="pen-size" min="1" max="100" value="18">
            </div>
            <div class="group">
                <label>描画</label>
                <select id="pen-type">
                    <option value="normal">通常</option>
                    <option value="blur">なじませ</option>
                </select>
            </div>
        </div>
    </div>

    <div class="panel" id="text-panel">
        <textarea id="text-input" class="text-compact-input">こんにちは
縦書き対応です</textarea>

        <div class="ctrl-grid3">
            <div class="cg">
                <label>方向</label>
                <select id="text-direction">
                    <option value="horizontal">横書き</option>
                    <option value="vertical">縦書き</option>
                </select>
            </div>
            <div class="cg">
                <label>フォント</label>
                <select id="font-family">
                    <option value="sans-serif">ゴシック</option>
                    <option value="serif">明朝</option>
                    <option value="cursive">手書き</option>
                </select>
            </div>
            <div class="cg">
                <label>文字色</label>
                <select id="text-color">
                    <option value="#ffffff">白</option>
                    <option value="#000000">黒</option>
                    <option value="#ff0000">赤</option>
                </select>
            </div>
        </div>

        <div class="slider-row">
            <span class="slider-label">サイズ</span>
            <input type="range" id="text-size" min="0.5" max="10" step="0.1" value="2">
        </div>

        <div id="row-horizontal-only">
            <div class="slider-row">
                <span class="slider-label">角度&thinsp;<span id="angle-val">0°</span></span>
                <input type="range" id="text-angle" min="-45" max="45" step="1" value="0">
            </div>
            <div class="cg" style="margin-bottom:8px">
                <label>文字背景</label>
                <select id="text-bg">
                    <option value="none">なし</option>
                    <option value="auto-black">黒</option>
                    <option value="auto-white">白</option>
                </select>
            </div>
        </div>

        <div class="row" style="margin-bottom:0">
            <button class="action-btn secondary" onclick="cancelText()">中止</button>
            <button class="action-btn primary" onclick="applyText()">配置確定</button>
        </div>
    </div>

</div>

<div class="bottom-bar">
    <button class="tool-btn active" id="btn-pen" onclick="setMode('pen')">✏️<div class="tool-label">線</div></button>
    <button class="tool-btn" onclick="setColor('#ffffff')">⚪<div class="tool-label">白</div></button>
    <button class="tool-btn" onclick="setColor('#000000')">⚫<div class="tool-label">黒</div></button>
    <button class="tool-btn" id="btn-text" onclick="startTextMode()">Ｔ<div class="tool-label">文字</div></button>
    <button class="tool-btn" onclick="undo()">↶<div class="tool-label">Undo</div></button>
    <button class="tool-btn" onclick="redo()">↷<div class="tool-label">Redo</div></button>
</div>

<input type="file" id="file-input" accept="image/*" class="hidden">

<script>
const main = document.getElementById('main');
const temp = document.getElementById('temp');

const mctx = main.getContext('2d');
const tctx = temp.getContext('2d');

const wrap = document.getElementById('canvas-wrap');
const viewport = document.getElementById('viewport');

let imgW = 1080;
let imgH = 1920;

main.width = imgW;
main.height = imgH;

temp.width = imgW;
temp.height = imgH;

wrap.style.width = imgW + 'px';
wrap.style.height = imgH + 'px';

mctx.fillStyle = "#ffffff";
mctx.fillRect(0,0,imgW,imgH);

let mode = "pen";
let currentColor = "#ffffff";

let scale = 0.4;
let panX = 0;
let panY = 0;

let drawing = false;
let prevX = 0;
let prevY = 0;

let activePointers = new Map();
let history = [];
let redoStack = [];

let textX = imgW / 2;
let textY = imgH / 2;

function fitCanvas(){
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;

    scale = Math.min((vw - 20) / imgW, (vh - 20) / imgH);
    panX = (vw - imgW * scale) / 2;
    panY = (vh - imgH * scale) / 2;

    updateTransform();
}

function updateTransform(){
    wrap.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
}

fitCanvas();

function saveHistory(){
    history.push(mctx.getImageData(0,0,imgW,imgH));
    if(history.length > 5){
        history.shift();
    }
    redoStack = [];
}

saveHistory();

function undo(){
    if(history.length <= 1) return;
    redoStack.push(history.pop());
    mctx.putImageData(history[history.length - 1], 0, 0);
}

function redo(){
    if(redoStack.length === 0) return;
    const data = redoStack.pop();
    history.push(data);
    mctx.putImageData(data,0,0);
}

function setMode(m){
    mode = m;
    document.querySelectorAll('.tool-btn').forEach(btn=>{
        btn.classList.remove('active');
    });

    if(m === "pen"){
        document.getElementById('btn-pen').classList.add('active');
    }

    hidePanels();

    if(m === "pen"){
        showPanel('pen-panel');
    }
}

function setColor(color){
    currentColor = color;
}

function showPanel(id){
    document.getElementById(id).classList.add('show');
}

function hidePanels(){
    document.querySelectorAll('.panel').forEach(panel=>{
        panel.classList.remove('show');
    });
}

function toggleMemoPanel(){
    const memoPanel = document.getElementById('memo-panel');
    memoPanel.classList.toggle('show');
}

document.addEventListener('DOMContentLoaded', () => {
    const memoInput = document.getElementById('memo-input');
    const savedMemo = localStorage.getItem('mrm_saved_memo');
    if (savedMemo) {
        memoInput.value = savedMemo;
    }
    memoInput.addEventListener('input', (e) => {
        localStorage.setItem('mrm_saved_memo', e.target.value);
    });
});

function getPos(e){
    const rect = wrap.getBoundingClientRect();
    return{
        x:(e.clientX - rect.left) * (imgW / rect.width),
        y:(e.clientY - rect.top) * (imgH / rect.height)
    };
}

function setupPen(ctx){
    ctx.lineWidth = document.getElementById('pen-size').value;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = currentColor;
}

wrap.addEventListener('pointerdown',e=>{
    activePointers.set(e.pointerId,{
        x:e.clientX,
        y:e.clientY
    });

    if(activePointers.size >= 2) return;

    const p = getPos(e);
    prevX = p.x;
    prevY = p.y;

    if(mode === "pen" || mode === "text-edit"){
        drawing = true;
    }
});

wrap.addEventListener('pointermove',e=>{
    if(!activePointers.has(e.pointerId)) return;

    const old = activePointers.get(e.pointerId);
    const dx = e.clientX - old.x;
    const dy = e.clientY - old.y;

    activePointers.set(e.pointerId,{
        x:e.clientX,
        y:e.clientY
    });

    if(activePointers.size >= 2){
        const pts = Array.from(activePointers.values());
        const p1 = pts[0];
        const p2 = pts[1];
        const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);

        if(!window.lastDist){
            window.lastDist = dist;
        }

        scale *= dist / window.lastDist;
        scale = Math.max(.1, Math.min(scale,8));
        window.lastDist = dist;

        panX += dx;
        panY += dy;
        updateTransform();
        return;
    }

    if(!drawing) return;

    const p = getPos(e);

    if(mode === "text-edit"){
        textX += p.x - prevX;
        textY += p.y - prevY;
        renderTextPreview();
        prevX = p.x;
        prevY = p.y;
        return;
    }

    if(mode === "pen"){
        const type = document.getElementById('pen-type').value;

        if(type === "blur"){
            const size = parseInt(document.getElementById('pen-size').value);
            const blurSize = size * 1.6;

            mctx.globalAlpha = .28;
            mctx.drawImage(
                main,
                p.x - blurSize / 2, p.y - blurSize / 2, blurSize, blurSize,
                p.x - size / 2, p.y - size / 2, size, size
            );
            mctx.globalAlpha = 1;
        }else{
            setupPen(mctx);
            mctx.beginPath();
            mctx.moveTo(prevX,prevY);
            mctx.lineTo(p.x,p.y);
            mctx.stroke();
        }
    }

    prevX = p.x;
    prevY = p.y;
});

wrap.addEventListener('pointerup',()=>{
    activePointers.clear();
    window.lastDist = null;
    if(drawing){
        drawing = false;
        saveHistory();
    }
});

function startTextMode(){
    mode = "text-edit";
    document.querySelectorAll('.tool-btn').forEach(btn=>{
        btn.classList.remove('active');
    });

    document.getElementById('btn-text').classList.add('active');
    hidePanels();
    showPanel('text-panel');

    textX = imgW / 2;
    textY = imgH / 2;
    renderTextPreview();
}

function drawText(ctx){
    const txt = document.getElementById('text-input').value;
    const direction = document.getElementById('text-direction').value;
    const font = document.getElementById('font-family').value;
    const color = document.getElementById('text-color').value;
    const textScale = parseFloat(document.getElementById('text-size').value);

    const size = 20 * textScale;
    const lineHeight = size * 1.2;
    const lines = txt.split('\n');

    ctx.save();
    ctx.font = `bold ${size}px ${font}`;
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if(direction === "horizontal"){
        const angleDeg = parseFloat(document.getElementById('text-angle').value);
        const angleRad = angleDeg * Math.PI / 180;
        const bgSelect = document.getElementById('text-bg').value;

        const blockW = (() => {
            let max = 0;
            lines.forEach(line => {
                const w = ctx.measureText(line).width;
                if(w > max) max = w;
            });
            return max;
        })();
        const blockH = lines.length * lineHeight;

        ctx.translate(textX, textY);
        ctx.rotate(angleRad);

        if(bgSelect !== "none"){
            const padX = size * 0.5;
            const padY = size * 0.3;
            const rw = blockW + padX * 2;
            const rh = blockH + padY * 2;
            const rx = -rw / 2;
            const ry = -rh / 2;
            const radius = size * 0.3;

            ctx.fillStyle = bgSelect === "auto-black" ? "#000000" : "#ffffff";
            ctx.beginPath();
            // 古い環境用の互換性フォールバック
            if (typeof ctx.roundRect === 'function') {
                ctx.roundRect(rx, ry, rw, rh, radius);
            } else {
                ctx.rect(rx, ry, rw, rh);
            }
            ctx.fill();
            ctx.fillStyle = color;
        }

        lines.forEach((line, index) => {
            ctx.fillText(line, 0, (index - (lines.length - 1) / 2) * lineHeight);
        });

    }else{
        // 【修正】縦書き時の配置軸を中心（センター）に変更
        const totalLines = lines.length;
        
        lines.forEach((line, lineIndex) => {
            const chars = Array.from(line);
            const totalChars = chars.length;

            chars.forEach((char, charIndex) => {
                // 行全体のセンターからのオフセット
                let x = textX - (lineIndex - (totalLines - 1) / 2) * lineHeight;
                // 各文字の垂直センターからのオフセット
                let y = textY + (charIndex - (totalChars - 1) / 2) * lineHeight;

                if("、。,.」』】".includes(char)){
                    x += size * .25;
                    y -= size * .15;
                }

                ctx.save();
                if("ー".includes(char)){
                    ctx.translate(x, y);
                    ctx.rotate(Math.PI / 2);
                    ctx.fillText(char, 0, 0);
                }else{
                    ctx.fillText(char, x, y);
                }
                ctx.restore();
            });
        });
    }

    ctx.restore();
}

function renderTextPreview(){
    tctx.clearRect(0,0,imgW,imgH);
    drawText(tctx);
}

function applyText(){
    drawText(mctx);
    tctx.clearRect(0,0,imgW,imgH);
    saveHistory();
    setMode('pen');
}

function cancelText(){
    tctx.clearRect(0,0,imgW,imgH);
    setMode('pen');
}

document.getElementById('text-input').oninput = renderTextPreview;

document.getElementById('text-direction').onchange = () => {
    const dir = document.getElementById('text-direction').value;
    const row = document.getElementById('row-horizontal-only');

    if(dir === "vertical"){
        row.classList.add('row-disabled'); // 【改善】CSSクラスでの制御に変更
    } else {
        row.classList.remove('row-disabled');
    }
    renderTextPreview();
};

document.getElementById('font-family').onchange = renderTextPreview;
document.getElementById('text-size').oninput = renderTextPreview;

document.getElementById('text-color').onchange = () => {
    const color = document.getElementById('text-color').value;
    const bgSel = document.getElementById('text-bg');

    if(bgSel.value === "auto-black" && color === "#000000"){
        bgSel.value = "auto-white";
    } else if(bgSel.value === "auto-white" && color === "#ffffff"){
        bgSel.value = "auto-black";
    }
    renderTextPreview();
};

document.getElementById('text-bg').onchange = () => {
    const color = document.getElementById('text-color').value;
    const bgVal = document.getElementById('text-bg').value;

    if(bgVal === "auto-black" && color === "#000000"){
        document.getElementById('text-color').value = "#ffffff";
    } else if(bgVal === "auto-white" && color === "#ffffff"){
        document.getElementById('text-color').value = "#000000";
    }
    renderTextPreview();
};

document.getElementById('text-angle').oninput = e => {
    document.getElementById('angle-val').textContent = e.target.value + '°';
    renderTextPreview();
};

function openImage(){
    document.getElementById('file-input').click();
}

function saveImage(){
    main.toBlob(blob=>{
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'edited_image.jpg';
        a.click();
        URL.revokeObjectURL(url);
    },'image/jpeg',0.95);
}

document.getElementById('pen-size').oninput = e=>{
    const size = parseInt(e.target.value);
    const preview = document.getElementById('size-preview');
    const circle = document.getElementById('size-circle');

    circle.style.width = size * scale + 'px';
    circle.style.height = size * scale + 'px';
    circle.style.background = currentColor;

    preview.style.opacity = 1;

    clearTimeout(window.previewTimer);
    window.previewTimer = setTimeout(()=>{
        preview.style.opacity = 0;
    },600);
};

/* ============================================================
   ① 自動保存（ステートセーブ）
   visibilitychange でバックグラウンド移行を検知し、
   Canvas の内容を IndexedDB に保存する。
   復元は次回起動時に自動的に行われる。
   ============================================================ */
const AUTO_SAVE_DB  = 'mrm_autosave';
const AUTO_SAVE_KEY = 'canvas_state';
const AUTO_SAVE_META = 'canvas_meta';

/** IndexedDB を開いて Promise で返す */
function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(AUTO_SAVE_DB, 1);
        req.onupgradeneeded = e => {
            e.target.result.createObjectStore('data');
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = () => reject(req.error);
    });
}

/** Canvas の現在状態を IndexedDB に保存 */
async function autoSaveState() {
    if (!imgW || !imgH) return; // 画像未読込なら何もしない
    try {
        const db   = await openDB();
        const blob = await new Promise(res => main.toBlob(res, 'image/png'));
        const tx   = db.transaction('data', 'readwrite');
        const st   = tx.objectStore('data');
        st.put(blob,                      AUTO_SAVE_KEY);
        st.put({ w: imgW, h: imgH },      AUTO_SAVE_META);
        await new Promise((res, rej) => {
            tx.oncomplete = res;
            tx.onerror    = () => rej(tx.error);
        });
        showSaveToast('💾 自動保存しました');
    } catch(err) {
        console.warn('autoSave failed:', err);
    }
}

/** 自動保存データを復元する */
async function restoreAutoSave() {
    try {
        const db   = await openDB();
        const tx   = db.transaction('data', 'readonly');
        const st   = tx.objectStore('data');

        const blob = await new Promise((res, rej) => {
            const r = st.get(AUTO_SAVE_KEY);
            r.onsuccess = () => res(r.result);
            r.onerror   = () => rej(r.error);
        });
        const meta = await new Promise((res, rej) => {
            const r = st.get(AUTO_SAVE_META);
            r.onsuccess = () => res(r.result);
            r.onerror   = () => rej(r.error);
        });

        if (!blob || !meta) return; // 保存データなし

        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
            imgW = meta.w;
            imgH = meta.h;
            main.width  = imgW;
            main.height = imgH;
            temp.width  = imgW;
            temp.height = imgH;
            wrap.style.width  = imgW + 'px';
            wrap.style.height = imgH + 'px';
            mctx.clearRect(0, 0, imgW, imgH);
            mctx.drawImage(img, 0, 0);
            URL.revokeObjectURL(url);
            fitCanvas();
            history = [];
            redoStack = [];
            saveHistory();
            showSaveToast('🔄 前回の作業を復元しました');
        };
        img.src = url;
    } catch(err) {
        console.warn('restoreAutoSave failed:', err);
    }
}

/** バックグラウンド移行時に保存 */
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
        autoSaveState();
    }
});

/** ページを閉じる直前にも保存を試みる */
window.addEventListener('pagehide', autoSaveState);

/** 起動時に復元 */
restoreAutoSave();

/** 保存完了トースト通知 */
function showSaveToast(msg) {
    let toast = document.getElementById('save-toast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'save-toast';
        Object.assign(toast.style, {
            position: 'fixed', bottom: '90px', left: '50%',
            transform: 'translateX(-50%)',
            background: 'rgba(0,0,0,0.75)', color: '#fff',
            padding: '8px 18px', borderRadius: '20px',
            fontSize: '13px', zIndex: '9999',
            transition: 'opacity 0.4s', pointerEvents: 'none'
        });
        document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.opacity = '1';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 2000);
}

/* ============================================================
   ② Canvas サイズ最適化
   モバイルで高解像度画像（4K など）をそのまま読み込むと
   メモリを大量消費するため、最大 2048px にリサイズして読込む。
   ============================================================ */
const MAX_CANVAS_SIZE = 2048; // 縦横いずれも超えたらリサイズ

document.getElementById('file-input').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
            let w = img.width;
            let h = img.height;

            // 長辺が MAX_CANVAS_SIZE を超える場合はアスペクト比を保ってリサイズ
            if (w > MAX_CANVAS_SIZE || h > MAX_CANVAS_SIZE) {
                const ratio = Math.min(MAX_CANVAS_SIZE / w, MAX_CANVAS_SIZE / h);
                w = Math.round(w * ratio);
                h = Math.round(h * ratio);
                showSaveToast(`📐 ${img.width}×${img.height} → ${w}×${h} にリサイズしました`);
            }

            imgW = w;
            imgH = h;

            main.width  = imgW;
            main.height = imgH;
            temp.width  = imgW;
            temp.height = imgH;

            wrap.style.width  = imgW + 'px';
            wrap.style.height = imgH + 'px';

            // オフスクリーンキャンバスでリサイズ描画
            const offscreen = document.createElement('canvas');
            offscreen.width  = imgW;
            offscreen.height = imgH;
            offscreen.getContext('2d').drawImage(img, 0, 0, imgW, imgH);

            mctx.clearRect(0, 0, imgW, imgH);
            mctx.drawImage(offscreen, 0, 0);

            fitCanvas();
            history = [];
            redoStack = [];
            saveHistory();
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
};

/* ============================================================
   ③ PWA — Service Worker 登録
   ============================================================ */
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('[PWA] SW registered:', reg.scope))
            .catch(err => console.warn('[PWA] SW registration failed:', err));
    });
}
